<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Content Manager — Premier Wellness Telehealth</title>
<link rel="icon" type="image/png" href="../assets/favicon.png" />
</head>
<body>
<!--
  Sveltia CMS, pinned to an exact version.

  Do NOT change this to @latest. Sveltia is pre-1.0 and ships frequently;
  an unattended breaking change would lock the practice owner out of her
  own site. Upgrade deliberately, then test signing in and saving an edit
  before committing the new version.
-->
<script src="https://unpkg.com/@sveltia/cms@0.228.0/dist/sveltia-cms.js"></script>
<script>
  // Style the preview pane to match the site.
  //
  // Sveltia's preview renders a generic view of the field values, so
  // without this the editor sees plain system-font text and cannot judge
  // how a change will look. preview.css carries over the typefaces, the
  // palette, and the gold italic accent in headings.
  if (window.CMS) {
    CMS.registerPreviewStyle("./preview.css");
  }
</script>
</body>
</html>
