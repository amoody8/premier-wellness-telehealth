name: Build and deploy to GitHub Pages

# DISABLED — the site moved to Netlify with the Astro port (Oct 2026).
#
# Astro + TinaCMS needs SSR for the editor's live region refresh, which
# GitHub Pages cannot do. This workflow would also fail now: `npm run
# build` runs `tinacms build` first, which requires TinaCloud credentials
# that are not available here.
#
# Kept rather than deleted until Netlify is verified. Delete this file
# once the old Pages site is retired.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A CMS save triggers a build. If several land close together, finish the
# running one and deploy the newest — but never cancel mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
